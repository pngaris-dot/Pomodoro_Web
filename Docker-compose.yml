services:
  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    environment:
      PRESETS_DIR: /app/presets
    volumes:
      - ./Frontend/Backgrounds:/app/presets:ro
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped