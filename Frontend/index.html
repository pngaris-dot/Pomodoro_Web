<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="bgVideo" class="bg-video" muted loop playsinline></video>

    <main class="card">
        <h1>Pomodoro</h1>

        <div class="modes">
            <button class="mode active" data-mode="focus">Focus</button>
            <button class="mode" data-mode="short">Short break</button>
            <button class="mode" data-mode="long">Long break</button>
        </div>

        <div id="timer">25:00</div>

        <div class="actions">
            <button id="start">Start</button>
            <button id="reset">Reset</button>
        </div>
    </main>

    <div class="dock">
        <details class="bgpanel">
            <summary>Background</summary>
            <div id="bgGrid" class="bg-grid"></div>
            <label class="upload">+ Upload image or video
                <input type="file" id="bgFile" accept="image/*,video/mp4,video/webm" hidden>
            </label>
            <small id="bgMsg"></small>
        </details>

        <details class="settings">
            <summary>Settings</summary>

            <label>Font
            <select id="font">
                <option value="ui-monospace, 'Source Code Pro', Consolas, monospace">Ui-monospace</option>
                <option value="sans-serif">Sans-serif</option>
                <option value="Georgia, serif">Serif</option>
                <option value="'Courier New', monospace">Monospace</option>
                <option value="'Comic Sans MS', cursive">Cursive</option>
            </select>
            </label>

            <label>Background color <input type="color" id="bgColor" value="#9e4545"></label>
            <label>Button color <input type="color" id="accentColor" value="#ff6b5e"></label>
            <label>word color <input type="color" id="textColor" value="#ffffff"></label>

            <label>Focus mins <input type="number" id="focusMin" min="1" max="180" value="25"></label>
            <label>Short-break mins <input type="number" id="shortMin" min="1" max="180" value="5"></label>
            <label>Long-break mins <input type="number" id="longMin" min="1" max="180" value="15"></label>
        </details>
    </div>

    <aside class="notes">
        <div class="notes-head">
            <strong>Notes</strong>
            <button type="button" id="addNote" class="mini">+ Note</button>
        </div>
        <div id="noteList" class="note-list"></div>
    </aside>

<nav class="music">
    <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" title="Spotify">
        <img src="Images/spotify.png" alt="Spotify">
    </a>

    <a href="https://music.youtube.com" target="_blank" rel="noopener noreferrer" title="YouTube Music">
        <img src="Images/ytmusic.png" alt="YouTube Music">
    </a>
</nav>

<!-- Auth bar (top-left) -->
<div class="auth-bar">
  <button id="authLogo" class="auth-logo" aria-label="Account">
    <img src="Images/logo.png" alt="Logo" onerror="this.style.display='none'">
  </button>

  <div id="authLinks" class="auth-links">
    <button id="signInLink" class="auth-link" type="button">Sign in</button>
    <span>|</span>
    <button id="signUpLink" class="auth-link" type="button">Sign up</button>
  </div>
  <button id="signOutLink" class="auth-link" type="button" hidden>Sign out</button>
</div>

<!-- Auth page (full screen) -->
<div id="authModal" class="auth-page" hidden>
  <button id="authClose" class="auth-close" aria-label="Close">×</button>

  <div class="auth-wrap">
    <form id="registerForm" class="auth-form">
      <h2>Register</h2>
      <input type="text" name="username" placeholder="username" required autocomplete="username">
      <input type="email" name="email" placeholder="email" required>
      <input type="email" name="verifyEmail" placeholder="verify email" required>
      <input type="password" name="password" placeholder="password" required minlength="6" autocomplete="new-password">
      <input type="password" name="verifyPassword" placeholder="verify password" required minlength="6" autocomplete="new-password">
      <button type="submit" class="auth-submit">sign up</button>
      <p id="registerMsg" class="auth-msg"></p>
    </form>

    <form id="loginForm" class="auth-form">
      <h2>Login</h2>
        <div class="auth-social">
        <button type="button" id="googleBtn" class="auth-social-btn" aria-label="Sign in with Google">Google</button>
        </div>
      <div class="auth-or"><span>or</span></div>
      <input type="email" name="email" placeholder="email" required autocomplete="email">
      <input type="password" name="password" placeholder="password" required autocomplete="current-password">
      <label class="auth-remember"><input type="checkbox" name="remember" checked> remember me</label>
      <button type="submit" class="auth-submit">sign in</button>
      <button type="button" id="forgotBtn" class="auth-forgot">forgot password?</button>
      <p id="loginMsg" class="auth-msg"></p>
    </form>
  </div>
</div>

    <script src="app.js"></script>
</body>
</html>
